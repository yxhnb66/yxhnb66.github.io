<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 22px; margin-bottom: 25px; color: #1a1a1a; }
        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #4a90e2; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #357abd; }
        button:disabled { background-color: #a0c5e8; cursor: not-allowed; }
        #result { margin-top: 25px; text-align: left; line-height: 1.6; word-wrap: break-word;}
        .error { color: #e64a19; }
        .loading { color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h1>Word Mate 翻译助手</h1>
    <input type="text" id="inputText" placeholder="请输入单词或句子" value="apple">
    <button id="queryBtn" onclick="translateText()">查询翻译</button>
    <div id="result"></div>
</div>

<script>
    // ⚠️ 请在这里替换成你自己的真实密钥
    const APP_KEY = '替换成你的应用ID';
    const APP_SECRET = '替换成你的应用密钥';

    async function translateText() {
        const inputText = document.getElementById('inputText').value.trim();
        const resultDiv = document.getElementById('result');
        const queryBtn = document.getElementById('queryBtn');

        if (!inputText) {
            resultDiv.innerHTML = '<p class="error">❌ 请输入要查询的内容</p>';
            return;
        }

        // 设置加载状态
        queryBtn.disabled = true;
        resultDiv.innerHTML = '<p class="loading">⏳ 正在查询有道词典...</p>';

        try {
            // 1. 生成签名所需参数
            const salt = new Date().getTime().toString();
            const curtime = Math.round(new Date().getTime() / 1000).toString();
            
            let signStr = APP_KEY + truncate(inputText) + salt + curtime + APP_SECRET;
            const sign = await sha256(signStr);

            // 2. 构造参数 (使用 GET 请求格式以便代理)
            const params = new URLSearchParams({
                q: inputText,
                from: 'auto',
                to: 'zh-CHS',
                appKey: APP_KEY,
                salt: salt,
                sign: sign,
                signType: 'v3',
                curtime: curtime
            });

            // 3. 使用可靠的公共 CORS 代理发起请求
            const apiUrl = `https://openapi.youdao.com/api?${params.toString()}`;
            const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(apiUrl);

            const response = await fetch(proxyUrl);
            if (!response.ok) {
                throw new Error(`服务器错误，状态码: ${response.status}`);
            }
            const data = await response.json();

            // 4. 解析并展示结果
            if (data.errorCode === '0') {
                const translation = data.translation.join(', ');
                let details = '';
                
                // 提取基本释义 (explanations)
                if (data.basic && data.basic.explains) {
                    details = `<p style="margin-top:10px; color:#666;"><strong>详细释义：</strong><br>${data.basic.explains.join('<br>')}</p>`;
                }

                resultDiv.innerHTML = `
                    <p><strong>翻译结果：</strong>${translation}</p>
                    ${details}
                `;
            } else {
                throw new Error(`有道API返回错误码: ${data.errorCode}`);
            }

        } catch (error) {
            console.error(error);
            resultDiv.innerHTML = `<p class="error">❌ 查询失败：${error.message}</p>`;
        } finally {
            queryBtn.disabled = false;
        }
    }

    // SHA-256 签名生成函数
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // 辅助函数：截取签名用的字符串
    function truncate(str) {
        if (!str) return '';
        const len = str.length;
        if (len <= 20) return str;
        return str.substring(0, 10) + len + str.substring(len - 10);
    }
</script>

</body>
</html>
