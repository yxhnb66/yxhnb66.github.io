<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --sub-text-color: #666666;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --border-color: #e1e4e8;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --sub-text-color: #a0a0a0;
            --primary-color: #5c9ce6;
            --primary-hover: #4a8ad4;
            --border-color: #333333;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.6; }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 700; }
        
        .theme-toggle { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-color); padding: 8px; border-radius: 50%; }
        .theme-toggle:hover { background-color: var(--border-color); }

        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 16px; background-color: var(--card-bg); color: var(--text-color); outline: none; }
        input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2); }
        
        button.primary-btn { padding: 12px 20px; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; white-space: nowrap; }
        button.primary-btn:hover { background-color: var(--primary-hover); }
        button.primary-btn:active { transform: scale(0.98); }

        .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 15px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .word-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .word-title { font-size: 28px; font-weight: bold; color: var(--primary-color); }
        .phonetic { color: var(--sub-text-color); font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;}
        
        .action-btns { display: flex; gap: 8px; }
        .icon-btn { background: none; border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 16px; color: var(--text-color); }
        .icon-btn:hover { background-color: var(--border-color); }
        .icon-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .meaning { font-size: 18px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .syn-ant { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .tag { padding: 4px 10px; background-color: var(--bg-color); border-radius: 20px; font-size: 14px; color: var(--sub-text-color); cursor: pointer; border: 1px solid var(--border-color); }
        .tag:hover { border-color: var(--primary-color); color: var(--primary-color); }

        .section-title { font-size: 14px; font-weight: 600; color: var(--sub-text-color); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background-color: var(--bg-color); border-radius: 8px; cursor: pointer; }
        .history-item:hover { background-color: var(--border-color); }
        .history-word { font-weight: 600; }
        .history-del { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 18px; padding: 0 5px; }

        .quiz-score { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 15px; color: var(--primary-color); }
        .quiz-option { display: block; width: 100%; padding: 12px; margin-bottom: 10px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; text-align: left; cursor: pointer; font-size: 16px; color: var(--text-color); }
        .quiz-option:hover { border-color: var(--primary-color); }
        .quiz-option.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .quiz-option.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: none; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--sub-text-color); }
        .tab-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .empty-state { text-align: center; padding: 30px; color: var(--sub-text-color); }
        .clear-btn { margin-top: 10px; padding: 8px 15px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .clear-btn:hover { background: #c0392b; }

        .loading { text-align: center; padding: 20px; color: var(--sub-text-color); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Word Mate</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="输入英文单词..." aria-label="搜索单词">
            <button class="primary-btn" id="searchBtn">搜索</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="result">查询结果</button>
            <button class="tab-btn" data-tab="history">历史记录</button>
            <button class="tab-btn" data-tab="quiz">单词测试</button>
        </div>

        <div id="resultPanel" class="panel">
            <div id="resultContent" class="empty-state">输入单词开始学习吧 ✨</div>
        </div>

        <div id="historyPanel" class="panel" style="display:none;">
            <div id="historyContent"></div>
        </div>

        <div id="quizPanel" class="panel" style="display:none;">
            <div id="quizContent"></div>
        </div>
    </div>

<script>
(function() {
    "use strict";

    // ========== 1. 核心状态与 DOM 引用 ==========
    const state = {
        history: JSON.parse(localStorage.getItem('wm_history') || '[]'),
        favorites: JSON.parse(localStorage.getItem('wm_favorites') || '[]'),
        currentWord: null,
        abortController: null
    };

    const dom = {
        themeToggle: document.getElementById('themeToggle'),
        searchInput: document.getElementById('searchInput'),
        searchBtn: document.getElementById('searchBtn'),
        resultContent: document.getElementById('resultContent'),
        historyContent: document.getElementById('historyContent'),
        quizContent: document.getElementById('quizContent'),
        tabs: document.querySelectorAll('.tab-btn'),
        panels: document.querySelectorAll('.panel')
    };

    // ========== 2. 工具函数 ==========
    const utils = {
        esc: (str) => str ? str.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m])) : '',
        
        saveHistory: () => {
            try {
                localStorage.setItem('wm_history', JSON.stringify(state.history));
            } catch (e) {
                state.history.shift();
                utils.saveHistory();
            }
        },
        
        saveFavorites: () => {
            try {
                localStorage.setItem('wm_favorites', JSON.stringify(state.favorites));
            } catch (e) {
                state.favorites.shift();
                utils.saveFavorites();
            }
        },

        toggleTheme: () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            dom.themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('wm_theme', newTheme);
        },

        switchTab: (tabName) => {
            dom.tabs.forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tabName));
            dom.panels.forEach(panel => panel.style.display = panel.id === `${tabName}Panel` ? 'block' : 'none');
            
            if (tabName === 'history') renderHistory();
            if (tabName === 'quiz') initQuiz();
        }
    };

    // ========== 3. API 请求与数据处理 ==========
    const api = {
        async fetchWord(word) {
            if (state.abortController) state.abortController.abort();
            state.abortController = new AbortController();
            
            try {
                // 并行请求英文词典和中文翻译
                const [enRes, zhRes] = await Promise.all([
                    fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, { signal: state.abortController.signal }),
                    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|zh`)
                ]);

                if (!enRes.ok) throw new Error('Word not found');
                
                const enData = await enRes.json();
                const zhData = await zhRes.json();

                const entry = enData[0];
                const phonetic = entry.phonetic || (entry.phonetics?.find(p => p.text)?.text) || '';
                const audioUrl = entry.phonetics?.find(p => p.audio && p.audio.includes('http'))?.audio || '';
                
                const meanings = entry.meanings.map(m => ({
                    pos: m.partOfSpeech,
                    def: m.definitions[0]?.definition || '',
                    syn: m.synonyms?.slice(0, 5) || [],
                    ant: m.antonyms?.slice(0, 5) || []
                }));

                const zhMeaning = zhData.responseData?.translatedText || '';

                return { word, phonetic, audioUrl, meanings, zhMeaning };
            } catch (err) {
                if (err.name === 'AbortError') return null;
                throw err;
            }
        }
    };

    // ========== 4. 渲染逻辑 ==========
    const render = {
        result(data) {
            if (!data) {
                dom.resultContent.innerHTML = `<div class="empty-state">未找到该单词，请检查拼写 🔍</div>`;
                return;
            }
            
            state.currentWord = data.word.toLowerCase();
            const isFav = state.favorites.includes(state.currentWord);
            
            let meaningsHtml = data.meanings.map(m => `
                <div style="margin-bottom: 15px;">
                    <div style="font-size: 14px; color: var(--primary-color); font-weight: bold;">${utils.esc(m.pos)}</div>
                    <div class="meaning">${utils.esc(m.def)}</div>
                    ${m.syn.length ? `<div class="section-title">同义词</div><div class="syn-ant">${m.syn.map(s => `<span class="tag" data-search="${utils.esc(s)}">${utils.esc(s)}</span>`).join('')}</div>` : ''}
                    ${m.ant.length ? `<div class="section-title" style="margin-top:10px;">反义词</div><div class="syn-ant">${m.ant.map(a => `<span class="tag" data-search="${utils.esc(a)}">${utils.esc(a)}</span>`).join('')}</div>` : ''}
                </div>
            `).join('');

            dom.resultContent.innerHTML = `
                <div class="card">
                    <div class="word-header">
                        <div>
                            <div class="word-title">${utils.esc(data.word)}</div>
                            <div class="phonetic">
                                ${utils.esc(data.phonetic)}
                                ${data.audioUrl ? `<button class="icon-btn" id="playAudioBtn" aria-label="播放发音">🔊</button>` : ''}
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="icon-btn ${isFav ? 'active' : ''}" id="favBtn" aria-label="收藏">⭐</button>
                        </div>
                    </div>
                    <div style="font-size: 18px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); color: var(--sub-text-color);">
                        ${utils.esc(data.zhMeaning)}
                    </div>
                    ${meaningsHtml}
                </div>
            `;

            // 绑定发音按钮事件
            const playBtn = document.getElementById('playAudioBtn');
            if (playBtn) {
                playBtn.addEventListener('click', () => new Audio(data.audioUrl).play());
            }

            // 绑定收藏按钮事件
            document.getElementById('favBtn').addEventListener('click', function() {
                const idx = state.favorites.indexOf(state.currentWord);
                if (idx > -1) {
                    state.favorites.splice(idx, 1);
                    this.classList.remove('active');
                } else {
                    state.favorites.push(state.currentWord);
                    this.classList.add('active');
                }
                utils.saveFavorites();
            });

            // 绑定同义词/反义词点击事件
            dom.resultContent.querySelectorAll('.tag[data-search]').forEach(tag => {
                tag.addEventListener('click', function() {
                    dom.searchInput.value = this.dataset.search;
                    searchWord();
                });
            });
        },

        history() {
            if (!state.history.length) {
                dom.historyContent.innerHTML = `<div class="empty-state">暂无历史记录 📝</div>`;
                return;
            }
            
            dom.historyContent.innerHTML = `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <div class="section-title" style="margin:0;">最近搜索</div>
                        <button class="clear-btn" id="clearHistoryBtn">清空</button>
                    </div>
                    <div class="history-list">
                        ${state.history.map((w, i) => `
                            <div class="history-item" data-index="${i}">
                                <span class="history-word">${utils.esc(w)}</span>
                                <button class="history-del" data-del-index="${i}" aria-label="删除">×</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        },

        quiz() {
            // 简单的本地测试逻辑
            const words = ['apple', 'happy', 'brave', 'knowledge', 'abandon', 'create', 'destroy', 'frequent'];
            const shuffled = words.sort(() => 0.5 - Math.random()).slice(0, 5);
            
            dom.quizContent.innerHTML = `
                <div class="card">
                    <div class="quiz-score">🧠 单词小测试</div>
                    <p style="text-align:center; margin-bottom:20px; color:var(--sub-text-color);">选出下列单词的正确中文意思</p>
                    <div id="quizQuestions"></div>
                    <div id="quizResult" style="text-align:center; margin-top:20px; font-weight:bold;"></div>
                </div>
            `;

            const questionsContainer = document.getElementById('quizQuestions');
            let score = 0;

            shuffled.forEach(word => {
                const options = [word, ...words.filter(w => w !== word).sort(() => 0.5 - Math.random()).slice(0, 3)].sort(() => 0.5 - Math.random());
                
                const qDiv = document.createElement('div');
                qDiv.style.marginBottom = '15px';
                qDiv.innerHTML = `<div style="font-weight:bold; margin-bottom:8px;">${utils.esc(word)}</div>`;
                
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = opt;
                    btn.addEventListener('click', function() {
                        if (this.classList.contains('correct') || this.classList.contains('wrong')) return;
                        
                        if (opt === word) {
                            this.classList.add('correct');
                            score++;
                        } else {
                            this.classList.add('wrong');
                            qDiv.querySelector('.quiz-option.correct') || 
                            Array.from(qDiv.querySelectorAll('.quiz-option')).forEach(b => {
                                if (b.textContent === word) b.classList.add('correct');
                            });
                        }
                        
                        document.getElementById('quizResult').textContent = `当前得分: ${score} / ${shuffled.length}`;
                    });
                    qDiv.appendChild(btn);
                });
                questionsContainer.appendChild(qDiv);
            });
        }
    };

    // ========== 5. 核心业务逻辑 ==========
    async function searchWord() {
        const word = dom.searchInput.value.trim();
        if (!word) return;

        utils.switchTab('result');
        dom.resultContent.innerHTML = `<div class="loading">正在查询 "${utils.esc(word)}"...</div>`;

        try {
            const data = await api.fetchWord(word);
            render.result(data);
            
            // 更新历史记录
            state.history = [word.toLowerCase(), ...state.history.filter(w => w !== word.toLowerCase())].slice(0, 50);
            utils.saveHistory();
        } catch (err) {
            dom.resultContent.innerHTML = `<div class="empty-state">查询失败，请检查网络连接 🌐</div>`;
        }
    }

    function initQuiz() { render.quiz(); }
    function renderHistory() { 
        render.history(); 
        // 绑定历史事件
                dom.historyContent.querySelectorAll('.history-item').forEach(item => {
            item.addEventListener('click', function(e) {
                // 如果点击的是删除按钮，则不触发搜索
                if (e.target.classList.contains('history-del')) return;
                dom.searchInput.value = this.querySelector('.history-word').textContent;
                searchWord();
            });
        });

        dom.historyContent.querySelectorAll('.history-del').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation(); // 阻止冒泡，避免触发搜索
                const index = parseInt(this.dataset.delIndex);
                state.history.splice(index, 1);
                utils.saveHistory();
                renderHistory();
            });
        });

        const clearBtn = document.getElementById('clearHistoryBtn');
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                state.history = [];
                utils.saveHistory();
                renderHistory();
            });
        }
    }

    // ========== 6. 初始化与事件绑定 ==========
    function init() {
        // 恢复主题
        const savedTheme = localStorage.getItem('wm_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        dom.themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        // 搜索事件
        dom.searchBtn.addEventListener('click', searchWord);
        dom.searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchWord();
        });

        // 主题切换
        dom.themeToggle.addEventListener('click', utils.toggleTheme);

        // Tab 切换
        dom.tabs.forEach(btn => {
            btn.addEventListener('click', () => utils.switchTab(btn.dataset.tab));
        });
    }

    init();

})();
</script>
</body>
</html>
