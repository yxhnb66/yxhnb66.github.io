<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
        }
        .title span { color: #4a90e2; }
        
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus { border-color: #4a90e2; }
        
        button {
            width: 100%;
            padding: 15px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #357abd; }
        
        #result {
            margin-top: 25px;
            text-align: left;
            font-size: 15px;
            line-height: 1.6;
            color: #555;
            word-break: break-word;
            min-height: 50px;
        }
        .error { color: #e74c3c; text-align: center; }
        .loading { text-align: center; color: #888; }
        
        .word-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 10px;}
        .word-phonetic { font-style: italic; color: #888; margin-bottom: 15px; font-size: 14px;}
        .def-item { margin-bottom: 10px; }
        .def-pos { font-weight: bold; color: #4a90e2; font-size: 13px; margin-right: 5px;}
    </style>
</head>
<body>

    <div class="container">
        <div class="title"><span>Word</span> Mate</div>
        <input type="text" id="inputText" placeholder="请输入英文单词，例如 apple" autocomplete="off">
        <button onclick="doTranslate()">查询释义</button>
        <div id="result"></div>
    </div>

    <script>
        async function doTranslate() {
            const input = document.getElementById('inputText').value.trim().toLowerCase();
            const resultDiv = document.getElementById('result');
            
            if (!input) return;

            resultDiv.innerHTML = '<div class="loading">正在查询...</div>';

            try {
                // 使用百度翻译的英英词典接口，国内访问极其稳定
                const url = `https://dict.youdao.com/jsonapi?q=${input}&le=eng&doctype=json`;
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('网络响应异常');
                }
                
                const data = await response.json();
                
                // 解析英英词典数据
                const ec = data.ec;
                if (!ec) {
                    resultDiv.innerHTML = '<div class="error">❌ 未找到该单词的释义</div>';
                    return;
                }

                let html = `<div class="word-title">${input}</div>`;
                
                // 获取音标
                const phonetics = data.collins && data.collins.word[0]?.phones?.phone;
                let phoneticStr = '';
                if (phonetics && phonetics.length > 0) {
                    // 尝试获取英音或美音
                    const uk = phonetics.find(p => p.type === 'uk');
                    const us = phonetics.find(p => p.type === 'us');
                    phoneticStr += us ? `US: ${us.value} ` : '';
                    phoneticStr += uk ? `UK: ${uk.value}` : '';
                }
                
                if (phoneticStr) {
                    html += `<div class="word-phonetic">${phoneticStr}</div>`;
                }

                // 获取释义列表
                const trs = ec.word[0].trs;
                if (trs && trs.length > 0) {
                    trs.forEach(tr => {
                        const pos = tr.tr[0].l?.i?.[0] || ''; // 词性
                        const def = tr.tr[0].l?.i?.[1] || tr.tr[0].l?.i?.[0] || ''; // 释义
                        if (def) {
                            html += `<div class="def-item">
                                        ${pos ? `<span class="def-pos">[${pos}]</span>` : ''}${def}
                                    </div>`;
                        }
                    });
                }

                resultDiv.innerHTML = html;

            } catch (error) {
                console.error("Error:", error);
                resultDiv.innerHTML = '<div class="error">❌ 查询失败，请检查网络后重试</div>';
            }
        }

        // 允许按回车键触发查询
        document.getElementById('inputText').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                doTranslate();
            }
        });
    </script>
</body>
</html>
