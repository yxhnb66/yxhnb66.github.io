<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 22px; margin-bottom: 30px; color: #1a1a1a; }
        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        input:focus { border-color: #3672b4; box-shadow: 0 0 0 3px rgba(54, 114, 180, 0.1); }
        button {
            width: 100%;
            padding: 15px;
            background-color: #3672b4;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:active { background-color: #2b5c91; }
        #result { margin-top: 25px; font-size: 16px; line-height: 1.6; word-break: break-all; }
        .error { color: #d9534f; font-size: 14px; }
        .success { color: #333; text-align: left; }
        .success strong { display: block; font-size: 18px; margin-bottom: 5px; color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Word Mate 翻译助手</h1>
        <input type="text" id="inputText" placeholder="请输入单词（如 apple）" value="apple">
        <button id="translateBtn">查询翻译</button>
        <div id="result"></div>
    </div>

    <script>
        // ⚠️⚠️⚠️ 请务必在这里填入你的有道应用ID和密钥 ⚠️⚠️⚠️
        const APP_KEY = ''; 
        const APP_SECRET = ''; 
        // ⚠️⚠️⚠️ 填入后保存，不要在引号之间留空格 ⚠️⚠️⚠️

        document.getElementById('translateBtn').addEventListener('click', translate);

        async function translate() {
            const text = document.getElementById('inputText').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!text) {
                resultDiv.innerHTML = '<span class="error">❌ 请输入要查询的单词</span>';
                return;
            }
            if (APP_KEY === '' || APP_SECRET === '') {
                resultDiv.innerHTML = '<span class="error">❌ 配置错误：请先在代码中填入你的有道应用ID和密钥！</span>';
                return;
            }

            resultDiv.innerHTML = '<span style="color: #888;">⏳ 正在查询中...</span>';

            try {
                // 生成签名所需参数
                const salt = Date.now();
                const curtime = Math.round(new Date().getTime() / 1000);
                let inputStr = text;
                if (text.length > 20) {
                    inputStr = text.substring(0, 10) + text.length + text.substring(text.length - 10);
                }
                
                // 使用内置SHA-256生成签名
                const signStr = APP_KEY + inputStr + salt + curtime + APP_SECRET;
                const sign = await sha256(signStr);

                // 直接调用有道官方API
                const formData = new URLSearchParams();
                formData.append('q', text);
                formData.append('appKey', APP_KEY);
                formData.append('salt', salt);
                formData.append('curtime', curtime);
                formData.append('sign', sign);
                formData.append('signType', 'v3');
                formData.append('from', 'auto');
                formData.append('to', 'zh-CHS');

                const response = await fetch('https://openapi.youdao.com/v2/api', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.errorCode === '0') {
                    // 解析并显示结果
                    let translation = data.translation ? data.translation.join(' ') : '';
                    let explains = '';
                    if (data.basic) {
                        explains = data.basic.explains ? data.basic.explains.join('\n') : '';
                    }
                    resultDiv.innerHTML = `
                        <div class="success">
                            <strong>${data.query}</strong>
                            ${translation ? `<p>${translation}</p>` : ''}
                            ${explains ? `<p style="color: #666; margin-top: 10px;">${explains}</p>` : ''}
                        </div>
                    `;
                } else {
                    // 返回有道官方的错误码，方便排查
                    resultDiv.innerHTML = `<span class="error">❌ 查询失败（错误码：${data.errorCode}）<br>请检查你的ID和密钥是否正确，或密钥是否有余额。</span>`;
                }
            } catch (error) {
                // 如果是跨域或网络问题，会捕获到这里
                resultDiv.innerHTML = `<span class="error">❌ 网络请求失败：${error.message}<br>请检查浏览器控制台(F12)获取详细报错信息。</span>`;
            }
        }

        // 内置SHA-256加密函数
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }
    </script>
</body>
</html>
