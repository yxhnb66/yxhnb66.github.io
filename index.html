<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --sub-text-color: #666666;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --border-color: #e1e4e8;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --sub-text-color: #a0a0a0;
            --primary-color: #5c9ce6;
            --primary-hover: #4a8ad4;
            --border-color: #333333;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--sub-text-color);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-area {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: none; /* 默认隐藏 */
        }

        .word-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .phonetic {
            font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
            color: var(--sub-text-color);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .translation {
            line-height: 1.6;
            font-size: 15px;
        }

        .loading {
            color: var(--sub-text-color);
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Word Mate</h1>
    
    <div class="input-group">
        <label for="wordInput">输入单词进行查询</label>
        <input type="text" id="wordInput" placeholder="例如：apple">
    </div>

    <button onclick="translateWord()">查询翻译</button>

    <div id="loading" class="loading">正在查询有道词典...</div>

    <div id="resultArea" class="result-area">
        <div id="wordTitle" class="word-title"></div>
        <div id="phonetic" class="phonetic"></div>
        <div id="translation" class="translation"></div>
    </div>
</div>

<script>
    // --- 配置区域 (已填入你的密钥) ---
    const APP_ID = '4e0f9a927fa1fddc'; 
    const APP_KEY = 'wZRV8fAD1oHimBLkSGiz9GA3bJDG0MEt'; 

    async function translateWord() {
        const input = document.getElementById('wordInput').value.trim();
        const resultArea = document.getElementById('resultArea');
        const loading = document.getElementById('loading');
        
        if (!input) {
            alert("请输入一个单词！");
            return;
        }

        // 显示加载状态，隐藏旧结果
        loading.style.display = 'block';
        resultArea.style.display = 'none';

        // 构造有道API所需的加密签名
        const curtime = Math.round(new Date().getTime() / 1000);
        const salt = (new Date()).getTime();
        const str1 = APP_ID + truncate(input) + salt + curtime + APP_KEY;
        
        // 使用浏览器内置的加密库计算 SHA256
        const signBuffer = new TextEncoder().encode(str1);
        const hashBuffer = await crypto.subtle.digest('SHA-256', signBuffer);
        const signArray = Array.from(new Uint8Array(hashBuffer));
        const sign = signArray.map(b => b.toString(16).padStart(2, '0')).join('');

        // 构造请求参数
        const params = new URLSearchParams({
            q: input,
            from: 'en',
            to: 'zh-CHS',
            appKey: APP_ID,
            salt: salt,
            curtime: curtime,
            sign: sign,
            signType: 'v3'
        });

        try {
            // 发送请求到有道API
            const response = await fetch(`https://openapi.youdao.com/api?${params}`);
            const data = await response.json();

            if (data.errorCode === '0') {
                // 查询成功，显示结果
                document.getElementById('wordTitle').innerText = data.query;
                
                // 处理音标（如果有）
                let phoneText = '';
                if (data.basic && data.basic.phonetic) {
                    phoneText = `/${data.basic.phonetic}/`;
                }
                document.getElementById('phonetic').innerText = phoneText;

                // 处理释义
                let transText = '';
                if (data.basic && data.basic.explains) {
                    transText = data.basic.explains.join('\n');
                } else if (data.translation) {
                    transText = data.translation.join('\n');
                }
                document.getElementById('translation').innerText = transText;

                resultArea.style.display = 'block';
            } else {
                alert('查询出错，错误码：' + data.errorCode);
            }
        } catch (error) {
            console.error(error);
            alert('网络请求失败，请检查网络或控制台。');
        } finally {
            loading.style.display = 'none';
        }
    }

    // 辅助函数：处理长文本截断（API要求）
    function truncate(q) {
        const len = q.length;
        if (len <= 20) return q;
        return q.substring(0, 10) + len + q.substring(len - 10, len);
    }
</script>

</body>
</html>
