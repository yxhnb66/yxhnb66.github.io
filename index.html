<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; width: 90%; max-width: 400px; }
        h1 { margin-bottom: 30px; font-size: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; outline: none; }
        button { width: 100%; padding: 12px; background-color: #2d64b1; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        #result { margin-top: 30px; text-align: left; min-height: 50px; word-break: break-all; font-size: 15px; line-height: 1.6; color: #333; }
        .error { color: #e74c3c; font-size: 13px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Word Mate 翻译助手</h1>
        <input type="text" id="inputText" placeholder="请输入要翻译的单词或句子" />
        <button id="translateBtn">查询翻译</button>
        <div id="result"></div>
    </div>

    <script>
        // 【重要】请在这里填入你的真实密钥，不要留空格
        const APP_KEY = '4e0f9a927fa1fddc'; 
        const APP_SECRET = 'wZRV8fAD1oHimBLkSGiz...'; // 请填入你的完整密钥
        
        document.getElementById('translateBtn').addEventListener('click', function() {
            const inputText = document.getElementById('inputText').value;
            const resultDiv = document.getElementById('result');
            
            if (!inputText.trim()) return;

            resultDiv.innerHTML = '<div class="error">正在翻译中，请稍候...</div>';
            this.disabled = true;

            // 有道翻译要求的签名逻辑
            const curtime = Math.round(new Date().getTime() / 1000); // 获取当前时间戳
            const salt = curtime; 
            const signStr = APP_KEY + inputText + salt + curtime + APP_SECRET;
            
            // 计算 SHA-256 签名
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(signStr))
                .then(buffer => Array.from(new Uint8Array(buffer))
                .map(b => ('0' + b.toString(16)).slice(-2)).join(''))
                .then(hash => {
                    // 发送翻译请求
                    return fetch('https://openapi.youdao.com/api?' + new URLSearchParams({
                        q: inputText,
                        appKey: APP_KEY,
                        salt: salt,
                        sign: hash,
                        signType: 'v3',
                        curtime: curtime,
                        from: 'AUTO',
                        to: 'AUTO'
                    }));
                })
                .then(response => response.json())
                .then(data => {
                    if (data.errorCode === '0') {
                        const translations = data.translation.join('\n');
                        let output = `<strong>翻译结果：</strong><br>${translations}`;
                        if (data.basic) {
                            output += `<br><br><strong>发音：</strong>${data.basic.phonetic || ''}<br><strong>释义：</strong>${data.basic.explains.join(', ')}`;
                        }
                        resultDiv.innerHTML = output;
                    } else {
                        resultDiv.innerHTML = `<div class="error">翻译出错（错误码：${data.errorCode}），请检查密钥是否正确。</div>`;
                    }
                })
                .catch(err => {
                    resultDiv.innerHTML = `<div class="error">网络请求失败：${err.message}</div>`;
                })
                .finally(() => {
                    document.getElementById('translateBtn').disabled = false;
                });
        });
    </script>
</body>
</html>
