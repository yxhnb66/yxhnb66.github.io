<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 全能词典</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        .nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .nav-btn {
            padding: 10px 14px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 50px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .nav-btn.active { background: #667eea; color: white; }
        .page { display: none; }
        .page.active { display: block; }
        .search-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-wrapper { position: relative; flex: 1; }
        .search-wrapper input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
        }
        button {
            padding: 12px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-fav { background: #ff9500; }
        .btn-fav.active { background: #ff4757; }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0; right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }
        .suggestion-item { padding: 12px 18px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .suggestion-word { font-weight: bold; color: #333; }
        .suggestion-meaning { color: #666; font-size: 13px; margin-left: 10px; }
        .result-card { background: #fafafa; border-radius: 10px; padding: 20px; margin-top: 15px; }
        .word-title { font-size: 26px; font-weight: bold; margin-bottom: 5px; }
        .phonetic { color: #666; margin-bottom: 10px; }
        .meaning-block { margin-bottom: 15px; }
        .pos { font-style: italic; color: #667eea; font-weight: bold; margin-bottom: 5px; }
        .definition { padding-left: 15px; line-height: 1.7; color: #333; }
        .example { padding-left: 30px; color: #555; font-size: 14px; margin-bottom: 3px; }
        .example-zh { padding-left: 45px; color: #888; font-size: 13px; margin-bottom: 8px; }
        .fav-item {
            background: #fafafa; padding: 12px 15px; border-radius: 8px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .fav-word { font-weight: bold; font-size: 16px; }
        .fav-meaning { color: #666; font-size: 13px; flex: 1; margin: 0 10px; }
        .remove-btn {
            background: #ff4757; color: white; border: none;
            width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px;
        }
        .test-container { text-align: center; padding: 20px; }
        .test-word { font-size: 28px; font-weight: bold; margin: 15px 0; }
        .test-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .test-option {
            padding: 15px; border: 2px solid #ddd; border-radius: 10px;
            cursor: pointer; font-size: 15px;
        }
        .test-option.correct { border-color: #4caf50; background: #e8f5e9; }
        .test-option.wrong { border-color: #ff4757; background: #ffe5e5; }
        .level-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .level-btn {
            padding: 8px 14px; border: 2px solid #667eea; background: white;
            color: #667eea; border-radius: 50px; cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .level-btn.active { background: #667eea; color: white; }
        .score-display { font-size: 18px; margin: 10px 0; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .toast {
            position: fixed; top: 20px; right: 20px; background: #4caf50; color: white;
            padding: 12px 20px; border-radius: 8px; z-index: 9999;
            transform: translateX(400px); transition: transform 0.3s; font-weight: bold;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: #ff4757; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .stat-card {
            background: #fafafa; border-radius: 10px; padding: 18px; text-align: center;
        }
        .stat-number { font-size: 28px; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 13px; color: #666; margin-top: 5px; }
        .wrong-item {
            background: #fff5f5; padding: 12px 15px; border-radius: 8px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
            border-left: 3px solid #ff4757;
        }
        .wrong-word { font-weight: bold; font-size: 16px; }
        .wrong-meaning { color: #666; font-size: 13px; flex: 1; margin: 0 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 全能词典</h1>
    <p class="subtitle">查词 · 收藏 · 测试 · 错题本</p>
    <div class="nav">
        <button class="nav-btn active" onclick="switchPage('lookup')">📖 查词</button>
        <button class="nav-btn" onclick="switchPage('favorites')">⭐ 收藏</button>
        <button class="nav-btn" onclick="switchPage('test')">📝 测试</button>
        <button class="nav-btn" onclick="switchPage('wrong')">❌ 错题本</button>
        <button class="nav-btn" onclick="switchPage('stats')">📊 统计</button>
    </div>

    <div class="page active" id="lookupPage">
        <div class="search-box">
            <div class="search-wrapper">
                <input type="text" id="searchBox" placeholder="输入英文单词..." oninput="handleInput()" onkeypress="if(event.key==='Enter')searchWord()">
                <div class="suggestions" id="suggestions"></div>
            </div>
            <button onclick="searchWord()">查询</button>
        </div>
        <div style="text-align:center; display:none;" id="favArea">
            <button class="btn-fav" id="favBtn" onclick="toggleFavorite()">⭐ 收藏</button>
        </div>
        <div id="result"></div>
    </div>

    <div class="page" id="favoritesPage"><div id="favList"></div></div>
    <div class="page" id="testPage"><div id="testArea"></div></div>
    <div class="page" id="wrongPage"><div id="wrongList"></div></div>
    <div class="page" id="statsPage"><div id="statsArea"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============ 全局变量 ============
let dictionary = {};
let currentWord = '';
let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
let wrongBook = JSON.parse(localStorage.getItem('wrongBook') || '[]');
let studyStats = JSON.parse(localStorage.getItem('studyStats') || '{"total":0,"correct":0,"wrong":0,"streak":0,"bestStreak":0}');
let currentLevel = 'elementary';
let testScore = 0;
let testTotal = 0;
let testQuestions = [];
let testMode = 'en2cn';

// ============ 加载词库 ============
async function loadDictionary() {
    try {
        const response = await fetch('dictionary.json');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        dictionary = await response.json();
        showToast('✅ 词库加载成功，共 ' + Object.keys(dictionary).length + ' 词');
    } catch (e) {
        showToast('❌ 词库加载失败', 'error');
    }
}

// ============ 页面切换 ============
function switchPage(page) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const pages = {'lookup':0, 'favorites':1, 'test':2, 'wrong':3, 'stats':4};
    document.querySelectorAll('.nav-btn')[pages[page]].classList.add('active');
    document.getElementById(page + 'Page').classList.add('active');
    if (page === 'favorites') renderFavorites();
    if (page === 'test') showTestLevels();
    if (page === 'wrong') renderWrongBook();
    if (page === 'stats') renderStats();
}

// ============ 查词 ============
function searchWord() {
    const word = document.getElementById('searchBox').value.trim().toLowerCase();
    if (!word) return;
    document.getElementById('suggestions').style.display = 'none';
    const resultDiv = document.getElementById('result');
    if (dictionary[word]) {
        currentWord = word;
        displayResult(word, dictionary[word]);
        document.getElementById('favArea').style.display = 'block';
        updateFavButton();
        return;
    }
    const match = Object.keys(dictionary).find(w => w.startsWith(word));
    if (match) {
        currentWord = match;
        displayResult(match, dictionary[match]);
        document.getElementById('favArea').style.display = 'block';
        updateFavButton();
        return;
    }
    resultDiv.innerHTML = '<div class="empty-state"><h3>未找到</h3><p>词库中暂无此词</p></div>';
    document.getElementById('favArea').style.display = 'none';
}

function displayResult(word, d) {
    const div = document.getElementById('result');
    let html = '<div class="result-card"><div class="word-title">' + word + '</div>';
    if (d.phonetic) html += '<div class="phonetic">' + d.phonetic + '</div>';
    html += '<button onclick="speakWord(\'' + word + '\')" style="padding:8px 15px;background:#34c759;color:white;border:none;border-radius:50px;cursor:pointer;font-size:14px;margin-bottom:10px;">🔊 发音</button>';
    if (d.pos) html += '<div class="meaning-block"><div class="pos">词性：' + d.pos + '</div></div>';
    if (d.en_definition) html += '<div class="meaning-block"><div class="pos">📖 英文释义</div><div class="definition">' + d.en_definition + '</div></div>';
    if (d.zh_definition) html += '<div class="meaning-block"><div class="pos">🇨🇳 中文释义</div><div class="definition">' + d.zh_definition + '</div></div>';
    if (d.examples) {
        html += '<div class="meaning-block"><div class="pos">例句</div>';
        d.examples.forEach(ex => {
            if (typeof ex === 'object' && ex.en) {
                html += '<div class="example">• ' + ex.en + '</div><div class="example-zh">' + ex.zh + '</div>';
            } else {
                html += '<div class="example">• ' + ex + '</div>';
            }
        });
        html += '</div>';
    }
    if (d.synonyms && d.synonyms.length) html += '<div class="meaning-block"><div class="pos">同义词</div><div class="definition">' + d.synonyms.join(', ') + '</div></div>';
    if (d.antonyms && d.antonyms.length) html += '<div class="meaning-block"><div class="pos">反义词</div><div class="definition">' + d.antonyms.join(', ') + '</div></div>';
    if (d.level) html += '<div class="meaning-block"><div class="pos">等级</div><div class="definition">' + d.level + '</div></div>';
    html += '</div>';
    div.innerHTML = html;
}

// ============ 自动补全 ============
function handleInput() {
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const box = document.getElementById('suggestions');
    if (!q) { box.style.display = 'none'; return; }
    const matches = Object.keys(dictionary).filter(w => w.startsWith(q)).slice(0, 15);
    if (matches.length) {
        box.innerHTML = matches.map(w => '<div class="suggestion-item" onclick="selectSuggestion(\'' + w + '\')"><span class="suggestion-word">' + w + '</span><span class="suggestion-meaning">' + (dictionary[w].zh_definition || '') + '</span></div>').join('');
        box.style.display = 'block';
    } else { box.style.display = 'none'; }
}
function selectSuggestion(w) {
    document.getElementById('searchBox').value = w;
    document.getElementById('suggestions').style.display = 'none';
    searchWord();
}

// ============ 发音 ============
function speakWord(word) {
    if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(word);
        u.lang = 'en-US'; u.rate = 0.9;
        speechSynthesis.speak(u);
    }
}

// ============ 收藏 ============
function toggleFavorite() {
    if (!currentWord) return;
    const idx = favorites.findIndex(f => f.word === currentWord);
    if (idx > -1) { favorites.splice(idx, 1); showToast('已取消收藏'); }
    else {
        favorites.unshift({ word: currentWord, meaning: dictionary[currentWord] ? (dictionary[currentWord].zh_definition || '') : '' });
        showToast('已收藏 ⭐');
    }
    localStorage.setItem('favorites', JSON.stringify(favorites));
    updateFavButton(); renderFavorites();
}
function updateFavButton() {
    const btn = document.getElementById('favBtn');
    const isFav = favorites.some(f => f.word === currentWord);
    btn.textContent = isFav ? '💖 已收藏' : '⭐ 收藏';
    btn.classList.toggle('active', isFav);
}
function renderFavorites() {
    const div = document.getElementById('favList');
    if (!favorites.length) { div.innerHTML = '<div class="empty-state"><h3>暂无收藏</h3></div>'; return; }
    div.innerHTML = favorites.map((f, i) => '<div class="fav-item" onclick="viewFavorite(\'' + f.word + '\')"><span class="fav-word">' + f.word + '</span><span class="fav-meaning">' + (f.meaning || '') + '</span><button class="remove-btn" onclick="event.stopPropagation();removeFavorite(' + i + ')">×</button></div>').join('');
}
function viewFavorite(w) { document.getElementById('searchBox').value = w; switchPage('lookup'); searchWord(); }
function removeFavorite(i) {
    favorites.splice(i, 1);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    renderFavorites(); updateFavButton();
}

// ============ 测试 ============
function showTestLevels() {
    const area = document.getElementById('testArea');
    const levels = [['elementary','小学'],['junior','初中'],['senior','高中'],['cet4','四级'],['cet6','六级'],['tem8','专八']];
    let html = '<div class="test-container"><h2>选择测试等级</h2><div class="level-btns">';
    levels.forEach(([key, name]) => {
        const count = Object.keys(dictionary).filter(w => dictionary[w].level && dictionary[w].level.includes(name)).length;
        html += '<button class="level-btn" onclick="startTest(\'' + key + '\')">' + name + ' (' + count + '词)</button>';
    });
    html += '</div><div class="level-btns" style="margin-top:15px;">';
    html += '<button class="level-btn' + (testMode === 'en2cn' ? ' active' : '') + '" onclick="setTestMode(\'en2cn\')">英→中</button>';
    html += '<button class="level-btn' + (testMode === 'cn2en' ? ' active' : '') + '" onclick="setTestMode(\'cn2en\')">中→英</button>';
    html += '</div></div>';
    area.innerHTML = html;
}
function setTestMode(m) { testMode = m; showTestLevels(); }
function startTest(level) {
    currentLevel = level;
    testScore = 0; testTotal = 0;
    const levelMap = {elementary:'小学', junior:'初中', senior:'高中', cet4:'四级', cet6:'六级', tem8:'专八'};
    const levelName = levelMap[level] || '';
    testQuestions = Object.keys(dictionary).filter(w => dictionary[w].level && dictionary[w].level.includes(levelName));
    if (!testQuestions.length) { showToast('该等级暂无词汇', 'error'); return; }
    testQuestions = testQuestions.sort(() => Math.random() - 0.5).slice(0, 10);
    showNextQuestion();
}
function showNextQuestion() {
    if (testTotal >= testQuestions.length) { showTestResult(); return; }
    const w = testQuestions[testTotal];
    const d = dictionary[w];
    const area = document.getElementById('testArea');
    let html = '<div class="test-container">';
    if (testMode === 'en2cn') {
        html += '<h3>选择正确的中文意思</h3><div class="test-word">' + w + '</div>';
        const correct = d.zh_definition || '';
        const opts = [correct];
        while (opts.length < 4) {
            const rw = testQuestions[Math.floor(Math.random() * testQuestions.length)];
            const rv = dictionary[rw].zh_definition || '';
            if (!opts.includes(rv)) opts.push(rv);
        }
        opts.sort(() => Math.random() - 0.5);
        html += '<div class="score-display">✅ ' + testScore + ' | 📝 ' + testTotal + '/' + testQuestions.length + '</div><div class="test-options">';
        opts.forEach(o => html += '<div class="test-option" onclick="checkAnswer(\'' + o.replace(/'/g, "\\'") + '\',\'' + correct.replace(/'/g, "\\'") + '\',this,\'' + w + '\')">' + o + '</div>');
        html += '</div>';
    } else {
        html += '<h3>选择正确的英文单词</h3><div class="test-word">' + (d.zh_definition || '') + '</div>';
        const correct = w;
        const opts = [correct];
        while (opts.length < 4) {
            const rw = testQuestions[Math.floor(Math.random() * testQuestions.length)];
            if (!opts.includes(rw)) opts.push(rw);
        }
        opts.sort(() => Math.random() - 0.5);
        html += '<div class="score-display">✅ ' + testScore + ' | 📝 ' + testTotal + '/' + testQuestions.length + '</div><div class="test-options">';
        opts.forEach(o => html += '<div class="test-option" onclick="checkAnswer(\'' + o + '\',\'' + correct + '\',this,\'' + w + '\')">' + o + '</div>');
        html += '</div>';
    }
    html += '</div>';
    area.innerHTML = html;
}
function checkAnswer(selected, correct, el, word) {
    const opts = document.querySelectorAll('.test-option');
    opts.forEach(o => o.style.pointerEvents = 'none');
    if (selected === correct) {
        el.classList.add('correct'); testScore++;
        studyStats.total++; studyStats.correct++;
        studyStats.streak++; studyStats.bestStreak = Math.max(studyStats.bestStreak, studyStats.streak);
        showToast('✅ 正确！');
    } else {
        el.classList.add('wrong');
        opts.forEach(o => { if (o.textContent === correct) o.classList.add('correct'); });
        studyStats.total++; studyStats.wrong++;
        studyStats.streak = 0;
        addToWrongBook(word);
        showToast('❌ 错误，已加入错题本');
    }
    localStorage.setItem('studyStats', JSON.stringify(studyStats));
    testTotal++;
    setTimeout(showNextQuestion, 1500);
}
function showTestResult() {
    const area = document.getElementById('testArea');
    const acc = testTotal ? Math.round(testScore / testTotal * 100) : 0;
    area.innerHTML = '<div class="test-container"><h2>测试完成！</h2><div class="score-display">得分：' + testScore + '/' + testTotal + '</div><div class="score-display">正确率：' + acc + '%</div><div class="level-btns" style="margin-top:20px;"><button class="level-btn" onclick="showTestLevels()">返回选择</button><button class="level-btn" onclick="startTest(\'' + currentLevel + '\')">再来一次</button></div></div>';
}

// ============ 错题本 ============
function addToWrongBook(word) {
    if (!wrongBook.some(w => w.word === word)) {
        wrongBook.unshift({ word: word, meaning: dictionary[word] ? (dictionary[word].zh_definition || '') : '' });
        localStorage.setItem('wrongBook', JSON.stringify(wrongBook));
    }
}
function renderWrongBook() {
    const div = document.getElementById('wrongList');
    if (!wrongBook.length) { div.innerHTML = '<div class="empty-state"><h3>暂无错题</h3><p>答题错误的单词会自动记录</p></div>'; return; }
    div.innerHTML = wrongBook.map((w, i) => '<div class="wrong-item"><span class="wrong-word">' + w.word + '</span><span class="wrong-meaning">' + (w.meaning || '') + '</span><button class="remove-btn" onclick="removeWrong(' + i + ')">×</button></div>').join('');
}
function removeWrong(i) {
    wrongBook.splice(i, 1);
    localStorage.setItem('wrongBook', JSON.stringify(wrongBook));
    renderWrongBook();
}

// ============ 统计 ============
function renderStats() {
    const area = document.getElementById('statsArea');
    const acc = studyStats.total ? Math.round(studyStats.correct / studyStats.total * 100) : 0;
    area.innerHTML = '<h2 style="text-align:center;">📊 学习统计</h2><div class="stats-grid">' +
        '<div class="stat-card"><div class="stat-number">' + studyStats.total + '</div><div class="stat-label">答题总数</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + studyStats.correct + '</div><div class="stat-label">答对题数</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + studyStats.wrong + '</div><div class="stat-label">答错题数</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + acc + '%</div><div class="stat-label">正确率</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + studyStats.streak + '</div><div class="stat-label">当前连续</div></div>' +
        '<div class="stat-card"><div class="stat-number">' + studyStats.bestStreak + '</div><div class="stat-label">最高连续</div></div>' +
        '</div>';
}

// ============ Toast ============
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (type === 'error' ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ 初始化 ============
loadDictionary();
renderFavorites();
</script>
</body>
</html>
