<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Mate - 极简背单词</title>
    <style>
        :root {
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --sub-text-color: #666666;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --border-color: #e1e4e8;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --sub-text-color: #a0a0a0;
            --primary-color: #5c9ce6;
            --primary-hover: #4a8ad4;
            --border-color: #333333;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 { font-size: 24px; display: flex; align-items: center; gap: 8px; }
        .theme-toggle { cursor: pointer; font-size: 24px; }

        .search-box {
            display: flex;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            border-radius: 8px;
            overflow: hidden;
            background: var(--card-bg);
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 0 20px;
            border: none;
            background: var(--primary-color);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background: var(--primary-hover); }

        .content-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow);
            min-height: 200px;
            text-align: center;
            display: none;
        }

        .word-title { font-size: 32px; margin-bottom: 5px; }
        .word-phonetic { color: var(--sub-text-color); font-size: 18px; margin-bottom: 20px; }
        .word-meaning { text-align: left; line-height: 1.6; }
        .meaning-group { margin-bottom: 15px; }
        .part-of-speech { font-weight: bold; margin-right: 10px; color: var(--primary-color); }
        .definition { display: block; margin-left: 20px; margin-bottom: 5px; color: var(--sub-text-color); }
        .error-msg { color: var(--sub-text-color); margin-top: 80px; }
        
        .audio-btn { 
            display: inline-block; margin-top: 15px; padding: 8px 15px; 
            background: var(--bg-color); border-radius: 20px; cursor: pointer; 
            font-size: 14px; color: var(--text-color); 
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>📚 Word Mate</h1>
        <span class="theme-toggle" id="themeToggle">🌙</span>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入英文单词查询，例如 abandon..." autocomplete="off">
        <button id="searchBtn">搜索</button>
    </div>

    <div class="content-box" id="resultBox">
        <h2 class="word-title" id="word"></h2>
        <div class="word-phonetic" id="phonetic"></div>
        <div class="word-meaning" id="meanings"></div>
    </div>
    
    <div class="error-msg" id="errorBox">
        请输入一个单词开始查询
    </div>
</div>

<script>
    // 核心状态与 DOM 元素
    const dom = {
        themeToggle: document.getElementById('themeToggle'),
        searchInput: document.getElementById('searchInput'),
        searchBtn: document.getElementById('searchBtn'),
        resultBox: document.getElementById('resultBox'),
        word: document.getElementById('word'),
        phonetic: document.getElementById('phonetic'),
        meanings: document.getElementById('meanings'),
        errorBox: document.getElementById('errorBox')
    };

    // 主题切换逻辑
    const setTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        dom.themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        localStorage.setItem('word-mate-theme', theme);
    };
    
    // 页面加载时初始化主题
    setTheme(localStorage.getItem('word-mate-theme') || 'light');
    dom.themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
    });

    // 显示加载、错误或结果
    const renderState = (type, htmlContent = '') => {
        dom.resultBox.style.display = 'none';
        dom.errorBox.style.display = 'block';
        
        if (type === 'loading') {
            dom.errorBox.innerHTML = '正在努力查询中... 🔍';
        } else if (type === 'error') {
            dom.errorBox.innerHTML = htmlContent || '查询失败，请检查网络连接或稍后重试。';
        } else if (type === 'success') {
            dom.errorBox.style.display = 'none';
            dom.resultBox.style.display = 'block';
        }
    };

    // 核心：获取数据并渲染
    async function fetchAndRenderWord(word) {
        if (!word.trim()) return;
        const searchWord = word.trim().toLowerCase();
        renderState('loading');

        try {
            // 1. 请求 Free Dictionary API (获取英文详情和发音)
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(searchWord)}`);
            if (!response.ok) {
                renderState('error', `未找到单词 <strong>${searchWord}</strong> 的英文信息，请确认拼写。`);
                return;
            }
            const data = await response.json();
            const entry = data[0];

            // 2. 提取并渲染数据
            dom.word.textContent = entry.word;
            dom.phonetic.textContent = entry.phonetic || '';
            dom.meanings.innerHTML = '';

            // 渲染发音播放按钮
            const audioObj = entry.phonetics.find(p => p.audio && p.audio.length > 0);
            if (audioObj) {
                dom.meanings.innerHTML += `<span class="audio-btn" onclick="new Audio('${audioObj.audio}').play()">🔊 播放发音</span>`;
            }

            // 渲染中文释义 (尝试请求 MyMemory API)
            let chineseTranslation = '';
            try {
                const cnResponse = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(searchWord)}&langpair=en|zh`);
                if (cnResponse.ok) {
                    const cnData = await cnResponse.json();
                    if (cnData.responseData && cnData.responseData.translatedText) {
                        chineseTranslation = `<p style="margin-top: 15px; color: var(--text-color); font-size: 16px;">💡 <strong>中文参考释义：</strong><br>${cnData.responseData.translatedText}</p>`;
                    }
                }
            } catch (e) {
                console.log("中文翻译获取失败，仅展示英文释义", e);
            }

            // 遍历词性并生成 HTML
            entry.meanings.forEach(meaning => {
                const partOfSpeech = `<span class="part-of-speech">${meaning.partOfSpeech}</span>`;
                const definitions = meaning.definitions.slice(0, 3).map(def => 
                    `<span class="definition">• ${def.definition}</span>`
                ).join('');
                
                dom.meanings.innerHTML += `<div class="meaning-group">${partOfSpeech}<br>${definitions}</div>`;
            });

            dom.meanings.innerHTML += chineseTranslation;
            renderState('success');

        } catch (err) {
            renderState('error');
            console.error(err);
        }
    }

    // 绑定搜索事件
    dom.searchBtn.addEventListener('click', () => fetchAndRenderWord(dom.searchInput.value));
    dom.searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') fetchAndRenderWord(dom.searchInput.value);
    });
</script>
</body>
</html>
