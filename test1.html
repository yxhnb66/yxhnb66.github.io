<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的极简课表</title>
    <style>
        :root { --primary: #007AFF; --bg: #f5f7fa; }
        body { margin: 0; padding: 0; font-family: sans-serif; background: var(--bg); }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .header h1 { margin: 0; font-size: 18px; }
        .header button { padding: 8px 15px; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-size: 14px;}
        #addBtn { background: var(--primary); }
        #exportBtn { background: #333; margin-right: 10px;}
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .course-card { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .course-card h2 { margin: 0 0 8px 0; font-size: 16px; }
        .course-card p { margin: 4px 0; color: #666; font-size: 14px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
        .modal-content { background: #fff; margin: 30% auto; padding: 20px; border-radius: 12px; width: 85%; max-width: 400px; }
        .modal h3 { margin-top: 0; }
        .modal label { display: block; margin-top: 10px; font-size: 14px; color: #333; }
        .modal input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal button { width: 48%; margin-top: 20px; padding: 10px 0; border: none; border-radius: 6px; cursor: pointer; font-size: 16px;}
        #saveBtn { background: var(--primary); color: #fff; float: left; }
        #cancelBtn { background: #ddd; float: right; }
        .clearfix::after { content: ""; display: table; clear: both; }
        .delete-btn { float: right; background: transparent; border: none; color: #ff3b30; font-size: 14px; cursor: pointer; margin-top: -5px;}
    </style>
</head>
<body>
    <div class="header">
        <h1>📅 我的极简课表</h1>
        <div>
            <button id="exportBtn">导出备份</button>
            <button id="addBtn">＋ 添加课程</button>
        </div>
    </div>
    <div class="container" id="courseContainer"></div>
    <div id="addModal" class="modal">
        <div class="modal-content clearfix">
            <h3>添加新课程</h3>
            <label>周几 (如: 周一)</label>
            <input type="text" id="day" placeholder="周一">
            <label>第几节 (如: 1)</label>
            <input type="text" id="period" placeholder="1">
            <label>课程名称</label>
            <input type="text" id="course" placeholder="高等数学">
            <label>教室 (如: A102)</label>
            <input type="text" id="location" placeholder="A102">
            <label>老师</label>
            <input type="text" id="teacher" placeholder="王老师">
            <label>学分</label>
            <input type="text" id="credits" placeholder="4">
            <label>备注</label>
            <input type="text" id="notes" placeholder="带计算器">
            <div style="margin-top:20px; clear:both;">
                <button id="saveBtn">保存</button>
                <button id="cancelBtn">取消</button>
            </div>
        </div>
    </div>
    <script>
        let courses = JSON.parse(localStorage.getItem('mySchedule')) || [
            { day: '周一', period: 1, course: '天天陶喆', location: '未知', teacher: '未知', credits: '-', notes: '无' },
            { day: '周二', period: 1, course: '让我先说说我那个女孩...', location: '未知', teacher: '未知', credits: '-', notes: '无' }
        ];
        const container = document.getElementById('courseContainer');
        function render() {
            container.innerHTML = '';
            courses.forEach((c, index) => {
                let html = `<div class="course-card"><button class="delete-btn" onclick="deleteCourse(${index})">删除</button>
                    <h2>${c.day} 第${c.period}节：${c.course}</h2>
                    <p>📍 ${c.location} | 👨‍🏫 ${c.teacher}</p>
                    <p>🎓 ${c.credits}学分 | 📝 ${c.notes}</p></div>`;
                container.innerHTML += html;
            });
        }
        function deleteCourse(index) { courses.splice(index, 1); saveData(); }
        function saveData() { localStorage.setItem('mySchedule', JSON.stringify(courses)); render(); }
        const modal = document.getElementById('addModal');
        document.getElementById('addBtn').onclick = () => modal.style.display = 'block';
        document.getElementById('cancelBtn').onclick = () => modal.style.display = 'none';
        document.getElementById('saveBtn').onclick = () => {
            courses.push({
                day: document.getElementById('day').value || '未知',
                period: document.getElementById('period').value || 0,
                course: document.getElementById('course').value || '未知课程',
                location: document.getElementById('location').value || '未知',
                teacher: document.getElementById('teacher').value || '未知',
                credits: document.getElementById('credits').value || '-',
                notes: document.getElementById('notes').value || '无'
            });
            saveData(); modal.style.display = 'none';
            ['day','period','course','location','teacher','credits','notes'].forEach(id => document.getElementById(id).value = '');
        };
        document.getElementById('exportBtn').onclick = () => {
            const data = JSON.stringify(courses, null, 4);
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '课表备份.json'; a.click();
        };
        render();
    </script>
</body>
</html>
