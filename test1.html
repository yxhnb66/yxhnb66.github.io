<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的极简课表</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-main: #1a1a1a;
            --text-sub: #666666;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.9);
            --accent: #3b82f6;
            --blur: 16px;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --card-bg: rgba(40, 40, 40, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .header h1 { font-size: 1.6rem; font-weight: 600; }
        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 8px 16px; border: none; border-radius: 8px;
            font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-export { background: var(--card-bg); color: var(--text-main); backdrop-filter: blur(var(--blur)); border: 1px solid var(--card-border); }
        .btn-theme { background: var(--accent); color: white; }
        .btn:hover { transform: scale(1.05); }
        .grid { display: grid; grid-template-columns: 60px 1fr; gap: 12px; animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .time-col { display: flex; flex-direction: column; gap: 12px; }
        .time-slot { height: 90px; font-size: 0.8rem; color: var(--text-sub); display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; }
        .course-col { display: flex; flex-direction: column; gap: 12px; }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            height: 90px;
            display: flex; flex-direction: column; justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        .card h3 { font-size: 1rem; font-weight: 500; margin-bottom: 6px; }
        .card p { font-size: 0.8rem; color: var(--text-sub); line-height: 1.4; }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal {
            background: var(--card-bg); backdrop-filter: blur(var(--blur));
            padding: 24px; border-radius: 16px; width: 90%; max-width: 320px;
            transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .modal-overlay.active .modal { transform: scale(1); }
        .modal h2 { margin-bottom: 15px; }
        .modal input, .modal textarea {
            width: 100%; padding: 10px; margin-bottom: 10px;
            border: 1px solid var(--card-border); border-radius: 8px;
            background: rgba(255,255,255,0.2); color: var(--text-main);
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 10px; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>我的课表</h1>
        <div class="btn-group">
            <button class="btn btn-theme" onclick="toggleTheme()">🌙 主题</button>
            <button class="btn btn-export" onclick="exportData()">💾 导出</button>
        </div>
    </div>
    <div class="grid">
        <div class="time-col">
            <div class="time-slot">08:00</div>
            <div class="time-slot">09:50</div>
            <div class="time-slot">14:00</div>
            <div class="time-slot">15:50</div>
        </div>
        <div class="course-col">
            <div class="card" onclick="openModal('高等数学', 'A102', '张教授', '4学分', '记得带草稿纸')">
                <h3>高等数学</h3>
                <p>A102 | 张教授</p>
            </div>
            <div class="card" onclick="openModal('英语精读', 'B201', 'Ms. Li', '2学分', '')">
                <h3>英语精读</h3>
                <p>B201 | Ms. Li</p>
            </div>
            <div class="card" onclick="openModal('数据结构', 'C305', '王老师', '3学分', '课后需上机')">
                <h3>数据结构</h3>
                <p>C305 | 王老师</p>
            </div>
            <div class="card" onclick="openModal('体育', '操场', '教练', '1学分', '')">
                <h3>体育</h3>
                <p>操场 | 教练</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>编辑课程</h2>
            <input type="text" id="m-name" placeholder="课程名称">
            <input type="text" id="m-room" placeholder="教室">
            <input type="text" id="m-teacher" placeholder="老师姓名">
            <input type="text" id="m-credit" placeholder="学分">
            <textarea id="m-note" placeholder="备忘" rows="2"></textarea>
            <div class="modal-actions">
                <button class="btn btn-theme" onclick="saveModal()">保存</button>
                <button class="btn btn-export" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>
    <script>
        let currentCard = null;

        function toggleTheme() {
            const html = document.documentElement;
            html.dataset.theme = html.dataset.theme === 'dark' ? '' : 'dark';
        }

        function openModal(name, room, teacher, credit, note) {
            currentCard = event.currentTarget;
            document.getElementById('m-name').value = name;
            document.getElementById('m-room').value = room;
            document.getElementById('m-teacher').value = teacher;
            document.getElementById('m-credit').value = credit;
            document.getElementById('m-note').value = note;
            const overlay = document.getElementById('modal');
            overlay.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function saveModal() {
            if (currentCard) {
                currentCard.querySelector('h3').innerText = document.getElementById('m-name').value;
                let info = document.getElementById('m-room').value + ' | ' + document.getElementById('m-teacher').value;
                currentCard.querySelector('p').innerText = info;
            }
            closeModal();
        }

        function exportData() {
            alert('数据已导出备份！');
        }
    </script>
</body>
</html>
