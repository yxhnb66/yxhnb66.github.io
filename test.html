<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordMate 平板增强版</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--blue:#2563eb;--soft:#eaf1ff;--line:#e3e8f0}
.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aeb8c7;--soft:#263b61;--line:#374151}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:32px}
.sub{color:var(--muted)}
.theme{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:12px;font-size:16px}
.search{display:flex;gap:10px;background:var(--card);padding:14px;border-radius:17px;box-shadow:0 8px 30px #0001}
.search input{flex:1;border:0;font-size:18px;background:transparent;outline:none}
.search button{border:0;border-radius:10px;padding:14px 22px;font-size:17px;background:var(--blue);color:#fff}
.tabs{display:flex;gap:8px;overflow:auto;margin:17px 0}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:12px 20px;border-radius:12px;font-size:16px}
.tab.active{background:var(--soft);border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:18px;padding:22px;margin-top:14px}
.tag{display:inline-block;color:var(--blue);background:var(--soft);padding:6px 12px;border-radius:7px;font-size:14px;margin:4px}
.actions{display:flex;gap:8px;margin-top:18px}
.small{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:22px}
.list{display:grid;gap:9px}
.item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:12px;border-radius:10px;background:var(--card)}
.option{padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.status{font-size:14px;color:var(--muted);margin-top:10px;text-align:center}
.word h2{margin:0;font-size:34px}
.word .phonetic{font-size:24px;color:var(--blue);margin:6px 0}
.def{margin:10px 0;line-height:1.7;font-size:17px}
.ex{color:var(--muted);margin:8px 0;padding-left:10px;border-left:2px solid var(--soft)}
@media(max-width:600px){
	.wrap{padding:16px 12px 50px}
	h1{font-size:26px}
	.word h2{font-size:28px}
	.word .phonetic{font-size:22px}
	.search button{padding:14px 16px}
	.actions{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div><h1>📖 WordMate</h1><div class="sub">单词查询</div></div>
<button class="theme" id="themeBtn">切换深色</button>
</div>
<div class="search">
<input id="q" placeholder="输入英文单词，例如 apple" autocomplete="off">
<button type="button" id="goBtn">🔍 搜索</button>
</div>
<div id="status" class="status">可联网搜索｜内置常用单词备用词库</div>
<div class="tabs">
<button class="tab active" data-t="search">🔍 搜索</button>
<button class="tab" data-t="history">🕒 历史</button>
<button class="tab" data-t="fav">⭐ 收藏</button>
</div>
<div id="app"></div>
</div>
<script>
const $=x=>document.querySelector(x),app=$("#app"),q=$("#q"),status=$("#status"),themeBtn=$("#themeBtn"),goBtn=$("#goBtn");
let current=null,history=JSON.parse(localStorage.getItem("wm_h")||"[]"),fav=JSON.parse(localStorage.getItem("wm_f")||"[]");

const local={

beautiful:{cn:"美丽的；漂亮的",pos:"形容词",phonetic:"/ˈbjuːtɪfl/",def:"pleasing to look at or hear",ex:"She has a beautiful smile.|她拥有美丽的笑容。"},
computer:{cn:"电脑；计算机",pos:"名词",phonetic:"/kəmˈpjuːtər/",def:"an electronic machine that processes information",ex:"I study with my computer.|我用电脑学习。"},
important:{cn:"重要的",pos:"形容词",phonetic:"/ɪmˈpɔːrtnt/",def:"having great value or importance",ex:"This is an important lesson.|这是一堂很重要的课。"},
