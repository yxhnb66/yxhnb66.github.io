<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordMate 稳定修复版</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--blue:#2563eb;--soft:#eaf1ff;--line:#e3e8f0}
.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aeb8c7;--soft:#263b61;--line:#374151}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:auto;padding:25px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{margin:0;font-size:31px}.sub{color:var(--muted);margin-top:5px}.theme{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;cursor:pointer}
.search{display:flex;gap:9px;background:var(--card);padding:9px;border-radius:17px;box-shadow:0 8px 30px #0001}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;padding:13px}.search button{border:0;border-radius:12px;background:var(--blue);color:white;font-weight:700;padding:0 22px;font-size:16px}
.tabs{display:flex;gap:8px;overflow:auto;margin:17px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:10px;cursor:pointer}.tab.active{color:var(--blue);background:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px}.hero{display:flex;justify-content:space-between}.word{font-size:38px;font-weight:800}.phonetic{color:var(--muted);margin-top:5px}.speak{border:0;background:var(--soft);border-radius:50%;width:48px;height:48px;font-size:21px;cursor:pointer}
.tag{display:inline-block;color:var(--blue);background:var(--soft);padding:5px 10px;border-radius:7px;font-size:13px;margin:18px 0 8px}.meaning{font-size:18px;line-height:1.7}.cn{font-size:21px;font-weight:650;margin:4px 0 12px}.example{background:var(--bg);padding:12px 14px;border-left:4px solid var(--blue);border-radius:7px;color:var(--muted);line-height:1.6}
.actions{display:flex;gap:8px;margin-top:18px}.small{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:22px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px}.item span{cursor:pointer;font-weight:600}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{padding:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer}.correct{border-color:#16a34a!important}.wrong{border-color:#dc2626!important}
.status{font-size:13px;color:var(--muted);margin-top:10px;text-align:center}
@media(max-width:600px){.word{font-size:30px}.options{grid-template-columns:1fr}.search button{padding:0 16px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>📖 WordMate</h1><div class="sub">稳定修复版 · 单词搜索</div></div><button class="theme" id="theme">🌙</button></div>
<div class="search"><input id="q" placeholder="输入英文单词，例如 apple" autocomplete="off"><button type="button" onclick="searchWord()">搜索</button></div>
<div id="status" class="status">可联网搜索；内置常用单词备用词库</div>
<div class="tabs"><button class="tab active" data-t="search">🔎 搜索</button><button class="tab" data-t="history">🕘 历史</button><button class="tab" data-t="fav">⭐ 收藏</button><button class="tab" data-t="quiz">🧠 测试</button></div>
<div id="app"></div>
</div>
<script>
// ========== 1. 基础配置与状态管理 ==========
const $ = x => document.getElementById(x);
const app = $("app"), q = $("q"), status = $("status");
let current = null;
let history = JSON.parse(localStorage.getItem("wm_h") || "[]");
let fav = JSON.parse(localStorage.getItem("wm_f") || "[]");

// 本地备用词库 (保持你的原样)
const local = {
    apple:{cn:"苹果",pos:"名词",phonetic:"/ˈæpəl/",def:"a round fruit with red, green, or yellow skin",ex:"I eat an apple every day."},
    book:{cn:"书；书籍",pos:"名词",phonetic:"/bʊk/",def:"a set of written or printed pages bound together",ex:"I bought a new book."},
    beautiful:{cn:"美丽的；漂亮的",pos:"形容词",phonetic:"/ˈbjuːtɪfəl/",def:"pleasing to look at or hear",ex:"She has a beautiful smile."},
    computer:{cn:"电脑；计算机",pos:"名词",phonetic:"/kəmˈpjuːtər/",def:"an electronic machine that processes information",ex:"I use my computer every day."},
    important:{cn:"重要的",pos:"形容词",phonetic:"/ɪmˈpɔːrtənt/",def:"having great value or importance",ex:"This is an important question."},
    happy:{cn:"快乐的；幸福的",pos:"形容词",phonetic:"/ˈhæpi/",def:"feeling pleasure or satisfaction",ex:"She looks very happy."},
    water:{cn:"水",pos:"名词",phonetic:"/ˈwɔːtər/",def:"a clear liquid that people, animals and plants need",ex:"Please drink some water."},
    friend:{cn:"朋友",pos:"名词",phonetic:"/frend/",def:"a person you know and like",ex:"He is my best friend."},
    school:{cn:"学校",pos:"名词",phonetic:"/skuːl/",def:"a place where children or students learn",ex:"I go to school every day."},
    future:{cn:"未来",pos:"名词",phonetic:"/ˈfjuːtʃər/",def:"the time that will happen after now",ex:"We should think about the future."},
    run:{cn:"跑；奔跑；运行",pos:"动词",phonetic:"/rʌn/",def:"to move quickly on foot",ex:"I run every morning."},
    read:{cn:"阅读；读",pos:"动词",phonetic:"/riːd/",def:"to look at and understand written words",ex:"I read a book every night."},
    write:{cn:"写；书写",pos:"动词",phonetic:"/raɪt/",def:"to form letters or words on a page",ex:"Please write your name."},
    eat:{cn:"吃",pos:"动词",phonetic:"/iːt/",def:"to put food into your mouth and swallow it",ex:"We eat dinner at seven."},
    drink:{cn:"喝；饮用",pos:"动词",phonetic:"/drɪŋk/",def:"to take liquid into your mouth and swallow it",ex:"I drink water every day."},
    go:{cn:"去；走",pos:"动词",phonetic:"/ɡoʊ/",def:"to move from one place to another",ex:"I go to school every day."},
    good:{cn:"好的；优秀的",pos:"形容词",phonetic:"/ɡʊd/",def:"of a high quality or standard",ex:"She is a good student."},
    new:{cn:"新的",pos:"形容词",phonetic:"/nuː/",def:"recently made, bought, or discovered",ex:"I have a new computer."},
    hello:{cn:"你好",pos:"感叹词",phonetic:"/həˈloʊ/",def:"a greeting used when meeting someone",ex:"Hello! Nice to meet you."},
    world:{cn:"世界",pos:"名词",phonetic:"/wɜːrld/",def:"the earth and all its people and countries",ex:"The world is changing."},
    family:{cn:"家庭；家人",pos:"名词",phonetic:"/ˈfæməli/",def:"a group of people related to each other",ex:"My family lives here."},
    student:{cn:"学生",pos:"名词",phonetic:"/ˈstuːdənt/",def:"a person who studies at a school or university",ex:"She is a good student."},
    teacher:{cn:"老师",pos:"名词",phonetic:"/ˈtiːtʃər/",def:"a person who teaches others",ex:"My teacher is very kind."},
    love:{cn:"爱；喜欢",pos:"动词/名词",phonetic:"/lʌv/",def:"to like or care about someone or something very much",ex:"I love my family."},
    learn:{cn:"学习",pos:"动词",phonetic:"/lɜːrn/",def:"to gain knowledge or a skill",ex:"I want to learn English."}
};

// ========== 2. 工具函数 ==========
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem("wm_h",JSON.stringify(history));localStorage.setItem("wm_f",JSON.stringify(fav))}
function cacheGet(key){try{return JSON.parse(localStorage.getItem(key)||"null")}catch(e){return null}}
function cacheSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}
function cacheDelete(key){try{localStorage.removeItem(key)}catch(e){}}

function speak(w){
    if(!("speechSynthesis" in window)){alert("当前浏览器不支持发音");return}
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(w);
    u.lang="en-US";
    speechSynthesis.speak(u);
}

function localResult(w){
    let x=local[w];
    if(!x) return null;
    return {
        word:w,
        phonetic:x.phonetic,
        meanings:[{partOfSpeech:x.pos,definitions:[{definition:x.def,example:x.ex,_cn:x.cn}]}],
        _cn:x.cn,
        _offline:true
    };
}

async function fetchWithTimeout(url, ms=7000){
    const c=new AbortController(), timer=setTimeout(()=>c.abort(), ms);
    try{return await fetch(url,{signal:c.signal,cache:"no-store"})}finally{clearTimeout(timer)}
}

// ========== 3. 核心搜索逻辑 ==========
async function searchWord(){
    const w=q.value.trim().toLowerCase().replace(/\s+/g," ");
    if(!w) return;
    if(!/^[a-zA-Z][a-zA-Z' -]{0,49}$/.test(w)){
        app.innerHTML='<div class="card empty">请输入英文单词，例如 <b>apple</b>。</div>';
     return;
    }

    // 缓存命中
    const cached=cacheGet("wm_word_"+w);
    if(cached){
        current=cached;
        history=[w,...history.filter(x=>x!==w)].slice(0,30); save();
        status.textContent="⚡ 缓存命中 · 即时显示";
        render(cached);
        addChinese(cached,w).then(()=>{
            cacheSet("wm_word_"+w,cached);
            if(current===cached){render(cached);status.textContent="✓ 中文释义已更新";}
        });
        return;
    }

    // 本地词库兜底
    const localData=localResult(w);
    if(localData){
        current=localData;
        history=[w,...history.filter(x=>x!==w)].slice(0,30); save();
        status.textContent="⚡ 本地词库 · 即时显示";
        render(localData);
    } else {
        status.textContent="⚡ 正在并行查询大型词库……";
        app.innerHTML='<div class="card empty">⚡ 正在查询，请稍候……</div>';
    }
// 回车触发搜索
q.onkeydown = e => { if (e.key === "Enter") searchWord(); };

// ========== 4. 数据标准化 ==========
function normalizeEnglishDictionaryAPI(d, w) {
    if (!d || !d.meanings) return null;
    return {
        word: d.word || w,
        phonetic: d.phonetic || (d.phonetics && d.phonetics[0]?.text) || "",
        meanings: d.meanings.map(m => ({
            partOfSpeech: m.partOfSpeech,
            definitions: m.definitions.slice(0, 5).map(def => ({
                definition: def.definition,
                example: def.example || "",
                synonyms: def.synonyms || [],
                antonyms: def.antonyms || []
            }))
        }))
    };
}

function normalizeOpenDictionary(d, w){
    if(!d) return null;
    const meanings=[];
    for(const e of (d.etymologies||[])){
        for(const p of (e.partsOfSpeech||[])){
            const defs=[];
            for(const s of (p.senses||[]).slice(0,5)){
                if(s.sense){
                    defs.push({
                        definition:s.sense,
                        example:(s.examples&&s.examples[0])||"",
                        synonyms:[],
                        antonyms:[]
                    });
                }
            }
            if(defs.length) meanings.push({partOfSpeech:p.partOfSpeech,definitions:defs});
        }
    }
    if(!meanings.length) return null;
    const synonyms=[], antonyms=[];
    for(const m of meanings){
        for(const d of m.definitions){
            if(Array.isArray(d.synonyms)) synonyms.push(...d.synonyms);
            if(Array.isArray(d.antonyms)) antonyms.push(...d.antonyms);
        }
    }
    return { word: w, phonetic: d.pronunciation || "", meanings, synonyms, antonyms };
}

// ========== 5. 中文翻译增强 (MyMemory API) ==========
async function addChinese(data, w) {
    // 如果已经有中文释义，直接返回
    if (data._cn || (data.meanings && data.meanings[0]?.definitions[0]?._cn)) return;
    try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(w)}&langpair=en|zh-CN`;
        const res = await fetchWithTimeout(url, 5000);
        const json = await res.json();
        if (json.responseStatus === 200 && json.responseData?.translatedText) {
            const cn = json.responseData.translatedText;
            // 写入第一个释义
            if (data.meanings && data.meanings[0]?.definitions[0]) {
                data.meanings[0].definitions[0]._cn = cn;
            }
            data._cn = cn;
        }
    } catch (e) { /* 翻译失败不影响主流程 */ }
}

// ========== 6. 核心渲染引擎 ==========
function render(data) {
    if (!data) return;
    const isFav = fav.includes(data.word);
    const cn = data._cn || data.meanings?.[0]?.definitions?.[0]?._cn || "";
    
    let meaningsHtml = "";
    if (data.meanings) {
        data.meanings.forEach(m => {
            meaningsHtml += `<div class="tag">${esc(m.partOfSpeech)}</div>`;
            m.definitions.forEach((def, i) => {
                const defCn = def._cn || (i === 0 ? cn : "");
                meaningsHtml += `
                    <div class="cn">${esc(defCn)}</div>
                    <div class="meaning">${esc(def.definition)}</div>
                    ${def.example ? `<div class="example" style="margin:8px 0 14px"><strong>例句：</strong>${esc(def.example)}</div>` : ""}
                `;
            });
        });
    }

    app.innerHTML = `
        <div class="card">
            <div class="hero">
                <div>
                    <div class="word">${esc(data.word)}</div>
                    <div class="phonetic">${esc(data.phonetic || "")}</div>
                </div>
                <button class="speak" onclick="speak('${esc(data.word)}')">🔊</button>
            </div>
            ${meaningsHtml}
            <div class="actions">
                <button class="small" onclick="toggleFav('${esc(data.word)}')">${isFav ? "💔 取消收藏" : "⭐ 收藏单词"}</button>
            </div>
        </div>
    `;
}

// ========== 7. 历史、收藏与交互 ==========
window.toggleFav = function(w) {
    if (fav.includes(w)) fav = fav.filter(x => x !== w);
    else fav.unshift(w);
    save();
    if (current && current.word === w) render(current);
};

function renderList(arr, type) {
    if (arr.length === 0) {
        app.innerHTML = `<div class="card empty">📭 暂无${type === "history" ? "搜索历史" : "收藏"}记录</div>`;
        return;
    }
    let html = `<div class="card"><div class="list">`;
    arr.forEach(w => {
        html += `<div class="item">
            <span onclick="q.value='${esc(w)}'; searchWord();">${esc(w)}</span>
            <button class="small" onclick="event.stopPropagation(); ${type === "fav" ? `toggleFav('${esc(w)}'); renderList(fav, 'fav')` : `q.value='${esc(w)}'; searchWord();`}">
                ${type === "fav" ? "移除" : "🔍"}
            </button>
        </div>`;
    });
    html += `</div></div>`;
    app.innerHTML = html;
}

// ========== 8. 测试模块 (Quiz) ==========
function startQuiz() {
    const keys = Object.keys(local);
    if (keys.length < 4) {
        app.innerHTML = `<div class="card empty">词库单词太少，无法生成测试题</div>`;
        return;
    }
    const correctIdx = Math.floor(Math.random() * keys.length);
    const correctWord = keys[correctIdx];
    const correctCn = local[correctWord].cn;
    
    let options = [correctCn];
    while (options.length < 4) {
        const rand = keys[Math.floor(Math.random() * keys.length)];
        const randCn = local[rand].cn;
        if (!options.includes(randCn)) options.push(randCn);
    }
    options.sort(() => Math.random() - 0.5);
    
    let html = `<div class="card">
        <div class="word" style="font-size:32px; text-align:center;">${correctWord}</div>
        <div class="phonetic" style="text-align:center; margin-bottom:18px;">${local[correctWord].phonetic}</div>
        <div class="options">`;
    options.forEach(opt => {
        html += `<button class="option" onclick="checkAnswer(this, '${esc(opt)}', '${esc(correctCn)}')">${esc(opt)}</button>`;
    });
    html += `</div><div id="quiz-status" class="status" style="margin-top:15px;"></div></div>`;
    app.innerHTML = html;
}
