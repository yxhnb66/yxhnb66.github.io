<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordMate 平板优化版</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#718096;--blue:#2563eb;--soft:#eaf1ff;--line:#e3e8f0}
.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--muted:#aeb8c7;--soft:#263b61;--line:#374151}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:32px}
.sub{color:var(--muted)}
.theme{border:1px solid var(--line);background:var(--card);padding:12px 20px;border-radius:12px;font-size:17px}
.search{display:flex;gap:10px;background:var(--card);padding:16px;border-radius:18px;box-shadow:0 8px 30px #000008}
.search input{flex:1;border:0;font-size:18px;background:transparent;outline:none}
.search button{border:0;border-radius:12px;padding:16px 24px;font-size:18px;background:var(--blue);color:#fff}
.tabs{display:flex;gap:10px;overflow:auto;margin:18px 0}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:14px 22px;border-radius:12px;font-size:17px}
.tab.active{background:var(--soft);border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);padding:22px;border-radius:20px;margin-top:14px}
.tag{display:inline-block;color:var(--blue);background:var(--soft);padding:6px 12px;border-radius:7px;font-size:14px;margin:4px}
.actions{display:flex;gap:10px;margin-top:20px}
.small{border:1px solid var(--line);background:var(--card);padding:11px 18px;border-radius:10px;font-size:16px}
.empty{text-align:center;color:var(--muted);padding:24px}
.list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:14px;border-radius:12px;background:var(--card)}
.status{font-size:14px;color:var(--muted);margin-top:12px;text-align:center}
.word h2{margin:0;font-size:36px}
.word .phonetic{font-size:26px;color:var(--blue);margin:8px 0}
.def{margin:12px 0;line-height:1.7;font-size:17px}
.ex{color:var(--muted);margin:10px 0;padding-left:12px;border-left:2px solid var(--soft)}

@media(max-width:600px){
	.wrap{padding:16px 12px 50px}
	h1{font-size:26px}
	.word h2{font-size:30px}
	.word .phonetic{font-size:24px}
	.search button{padding:16px 18px}
	.actions{flex-wrap:wrap}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div><h1>📖 WordMate</h1><div class="sub">单词查询</div></div>
<button class="theme" id="themeBtn">切换深色</button>
</div>
<div class="search">
<input id="q" placeholder="输入英文单词" autocomplete="off">
<button type="button" id="goBtn">🔍 搜索</button>
</div>
<div id="status" class="status"></div>
<div class="tabs">
<button class="tab active" data-t="search">🔍 搜索</button>
<button class="tab" data-t="history">🕒 历史</button>
<button class="tab" data-t="fav">⭐ 收藏</button>
</div>
<div id="app"></div>
</div>
